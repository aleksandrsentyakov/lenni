<form class="reserve">
  <div class="reserve__checks">
    <h4 class="reserve__section-title">Забронировать столик</h4>

    <label class="reserve__check check check--red">
      <input type="checkbox" name="table_1" class="check__input" />
      <span class="check__mark"></span>
      <span class="check__label">1 стол</span>
    </label>

    <label class="reserve__check check">
      <input type="checkbox" name="table_2" class="check__input" />
      <span class="check__mark"></span>
      <span class="check__label">2 стол</span>
    </label>

    <!-- Еще чекбоксы -->
    <label class="reserve__check check check--disabled">
      <input type="checkbox" name="table_5" class="check__input" disabled />
      <span class="check__mark"></span>
      <span class="check__label">5 стол </span>
    </label>

    <!-- Оставшиеся чекбоксы -->
  </div>
  <div class="reserve__scheme">
    <div class="reserve__scheme-container">
      <h4 class="reserve__scheme-title">Сцена</h4>

      <div class="reserve__scheme-wrapper">
        <img src="./assets/images/chart_seedings.svg" alt="Схема зала" class="reserve__scene scene" width="780" height="399" />
      </div>
    </div>
  </div>

  <div class="reserve__order">
    <h4 class="reserve__section-title">Ваши пригласительные билеты</h4>
    <div class="reserve__tables">
      <div class="reserve__table">1 стол</div>
      <div class="reserve__table">2 стол</div>
      <div class="reserve__table">3 стол</div>
      <div class="reserve__table">4 стол</div>
      <div class="reserve__table">5 стол</div>
      <div class="reserve__table">6 стол</div>
      <div class="reserve__table">7 стол</div>
      <div class="reserve__table">8 стол</div>
      <div class="reserve__table">9 стол</div>
      <div class="reserve__table">10 стол</div>
      <div class="reserve__table">11 стол</div>
    </div>

    <div class="reserve__tickets-list">
      <div class="reserve__tickets">
        <div class="reserve__qty" data-caption="шт." data-price="1400">9</div>
        <div class="reserve__price">1400 ₽</div>
        <div class="reserve__sum" data-currency="₽">12 600</div>
      </div>

      <div class="reserve__tickets">
        <div class="reserve__qty" data-caption="шт." data-price="1250">4</div>
        <div class="reserve__price">1250 ₽</div>
        <div class="reserve__sum" data-currency="₽">5000</div>
      </div>
    </div>

    <div class="reserve__total" data-caption="Сумма" data-currency="₽">
      17 600
    </div>

    <button type="submit" class="btn btn--red reserve__submit">
      Купить билеты
    </button>
  </div>

  <!-- Прочие элементы формы -->
</form>
